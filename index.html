<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentTask - To-Do List Mahasiswa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🎓 StudentTask</h1>
            <p>To-Do List Mahasiswa</p>
        </header>

        <!-- Statistik -->
        <div class="stats">

            <div class="stat-box">
                <h3 id="totalTask">0</h3>
                <p>Total Tugas</p>
            </div>

            <div class="stat-box">
                <h3 id="completedTask">0</h3>
                <p>Selesai</p>
            </div>

            <div class="stat-box">
                <h3 id="pendingTask">0</h3>
                <p>Belum Selesai</p>
            </div>

        </div>


        <!-- Input Tugas -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Masukkan tugas kuliah..."
            >

            <!-- Tanggal + Jam -->
            <input
                type="datetime-local"
                id="dateInput"
                lang="id"
            >

            <button onclick="addTask()">
                Tambah Tugas
            </button>

        </div>


        <!-- Filter -->
        <div class="filter-section">

            <button onclick="filterTasks('all')">
                Semua
            </button>

            <button onclick="filterTasks('pending')">
                Belum Selesai
            </button>

            <button onclick="filterTasks('completed')">
                Selesai
            </button>

        </div>


        <!-- Daftar Tugas -->
        <div id="taskList"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>

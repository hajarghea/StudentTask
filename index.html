<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentTask - To Do List Mahasiswa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #dbeafe, #eff6ff, #e0f2fe);
            min-height: 100vh;
            color: #1e293b;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #2563eb;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #bfdbfe;
        }

        .header-info {
            text-align: right;
            font-size: 14px;
        }

        #clock {
            font-weight: bold;
            margin-top: 5px;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 86%;
            max-width: 1200px;
            margin: 30px auto;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .welcome h1 {
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #64748b;
        }

        /* =========================
           STATISTICS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        /* =========================
           SECTION
        ========================= */

        .section {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title h2 {
            color: #1e40af;
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            border: none;
            cursor: pointer;
            border-radius: 10px;
            padding: 10px 15px;
            font-weight: bold;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-success {
            background: #dcfce7;
            color: #16a34a;
        }

        /* =========================
           CALENDAR
        ========================= */

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-header h3 {
            color: #1d4ed8;
        }

        .calendar-buttons button {
            background: #dbeafe;
            color: #1d4ed8;
            margin-left: 5px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 7px;
        }

        .day-name {
            text-align: center;
            font-weight: bold;
            color: #64748b;
            padding: 8px;
        }

        .calendar-day {
            min-height: 80px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px;
            background: #f8fafc;
        }

        .calendar-day.today {
            border: 2px solid #2563eb;
            background: #eff6ff;
        }

        .day-number {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .calendar-task {
            background: #2563eb;
            color: white;
            border-radius: 5px;
            padding: 4px;
            font-size: 11px;
            margin-top: 4px;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #334155;
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        /* =========================
           FILTER
        ========================= */

        .filter-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-area input {
            flex: 1;
            min-width: 220px;
        }

        .filter-area button.active {
            background: #2563eb;
            color: white;
        }

        /* =========================
           TASK CARD
        ========================= */

        #taskList {
            display: grid;
            gap: 15px;
        }

        .task-card {
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 18px;
            background: #ffffff;
        }

        .task-card.completed {
            opacity: 0.7;
            background: #f8fafc;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .task-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e40af;
        }

        .task-category {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .badge-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .badge-medium {
            background: #ffedd5;
            color: #ea580c;
        }

        .badge-low {
            background: #dcfce7;
            color: #16a34a;
        }

        .deadline {
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .deadline.today {
            color: #dc2626;
        }

        .deadline.tomorrow {
            color: #ea580c;
        }

        .deadline.safe {
            color: #16a34a;
        }

        .deadline.overdue {
            color: #b91c1c;
        }

        .progress-area {
            margin-top: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 9px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 20px;
        }

        .task-note {
            margin-top: 12px;
            padding: 10px;
            background: #eff6ff;
            border-radius: 8px;
            font-size: 14px;
            color: #475569;
        }

        .task-file {
            margin-top: 10px;
            font-size: 13px;
            color: #2563eb;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 9998;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            border-radius: 18px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #1d4ed8;
        }

        .close {
            background: #fee2e2;
            color: #dc2626;
            font-size: 20px;
            width: 35px;
            height: 35px;
            padding: 0;
        }

        /* =========================
           NOTIFICATION
        ========================= */

        #notificationContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 340px;
        }

        .deadline-notification {
            background: white;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
            border-left: 5px solid #2563eb;
            animation: slideIn 0.4s ease;
        }

        .deadline-notification.warning {
            border-left-color: #f59e0b;
        }

        .deadline-notification.danger {
            border-left-color: #ef4444;
        }

        .deadline-notification.success {
            border-left-color: #22c55e;
        }

        .notification-title {
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .notification-message {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
        }

        .notification-close {
            float: right;
            border: none;
            background: transparent;
            padding: 0;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            header {
                padding: 18px 5%;
            }

            .container {
                width: 92%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .calendar-day {
                min-height: 60px;
            }

            .calendar-task {
                font-size: 9px;
            }
        }

        @media (max-width: 480px) {

            .logo {
                font-size: 20px;
            }

            .header-info {
                font-size: 11px;
            }

            .section {
                padding: 18px;
            }

            .calendar-grid {
                gap: 3px;
            }

            .calendar-day {
                min-height: 50px;
                padding: 4px;
            }

            .day-name {
                font-size: 11px;
                padding: 4px;
            }

            .task-header {
                flex-direction: column;
            }

            #notificationContainer {
                top: 10px;
                right: 10px;
                left: 10px;
                width: auto;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        Student<span>Task</span>
    </div>

    <div class="header-info">
        <div id="dateDisplay"></div>
        <div id="clock"></div>
    </div>

</header>


<div class="container">

    <!-- =========================
         WELCOME
    ========================= -->

    <div class="welcome">

        <h1>To-Do List Mahasiswa 🎓</h1>

        <p>
            Kelola tugas kuliah, deadline, progress,
            dan file tugas dengan lebih mudah.
        </p>

    </div>


    <!-- =========================
         STATISTIK
    ========================= -->

    <div class="stats">

        <div class="stat-card">
            <h3>Total Tugas</h3>
            <div class="number" id="totalTasks">0</div>
        </div>

        <div class="stat-card">
            <h3>Tugas Belum Selesai</h3>
            <div class="number" id="pendingTasks">0</div>
        </div>

        <div class="stat-card">
            <h3>Tugas Selesai</h3>
            <div class="number" id="completedTasks">0</div>
        </div>

    </div>


    <!-- =========================
         KALENDER
    ========================= -->

    <div class="section">

        <div class="calendar-header">

            <h3 id="calendarTitle"></h3>

            <div class="calendar-buttons">

                <button onclick="previousMonth()">‹</button>

                <button onclick="goToday()">Hari Ini</button>

                <button onclick="nextMonth()">›</button>

            </div>

        </div>

        <div class="calendar-grid" id="calendar"></div>

    </div>


    <!-- =========================
         TAMBAH TUGAS
    ========================= -->

    <div class="section">

        <div class="section-title">
            <h2>➕ Tambah Tugas</h2>
        </div>

        <form id="taskForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>Nama Tugas</label>

                    <input
                        type="text"
                        id="taskName"
                        placeholder="Contoh: Membuat laporan"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Mata Kuliah</label>

                    <select id="taskCategory" required>

                        <option value="">
                            Pilih Mata Kuliah
                        </option>

                        <option>
                            Pemrograman Web
                        </option>

                        <option>
                            Basis Data
                        </option>

                        <option>
                            Pengolahan Citra Digital
                        </option>

                        <option>
                            Kecerdasan Buatan
                        </option>

                        <option>
                            Rekayasa Perangkat Lunak
                        </option>

                        <option>
                            Internet of Things
                        </option>

                        <option>
                            Jaringan Komputer
                        </option>

                        <option>
                            Lainnya
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Tanggal Deadline</label>

                    <input
                        type="date"
                        id="taskDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Waktu Deadline</label>

                    <input
                        type="time"
                        id="taskTime"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>Catatan</label>

                    <textarea
                        id="taskNote"
                        placeholder="Tambahkan catatan tugas..."
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label>File Tugas</label>

                    <input
                        type="file"
                        id="taskFile"
                        accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.rar,.jpg,.jpeg,.png"
                    >

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Simpan Tugas
                </button>

            </div>

        </form>

    </div>


    <!-- =========================
         DAFTAR TUGAS
    ========================= -->

    <div class="section">

        <div class="section-title">

            <h2>📋 Daftar Tugas</h2>

        </div>


        <div class="filter-area">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Cari tugas atau mata kuliah..."
                oninput="renderTasks()"
            >

            <button
                class="btn-secondary active"
                id="filterAll"
                onclick="setFilter('all')"
            >
                Semua
            </button>

            <button
                class="btn-secondary"
                id="filterPending"
                onclick="setFilter('pending')"
            >
                Belum Selesai
            </button>

            <button
                class="btn-secondary"
                id="filterCompleted"
                onclick="setFilter('completed')"
            >
                Selesai
            </button>

        </div>


        <div id="taskList"></div>

    </div>

</div>


<!-- =========================
     MODAL EDIT
========================= -->

<div
    class="modal"
    id="editModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>✏️ Update Tugas</h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form id="editForm">

            <div class="form-grid">

                <div class="form-group full">

                    <label>Nama Tugas</label>

                    <input
                        type="text"
                        id="editName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Mata Kuliah</label>

                    <select
                        id="editCategory"
                        required
                    >

                        <option>
                            Pemrograman Web
                        </option>

                        <option>
                            Basis Data
                        </option>

                        <option>
                            Pengolahan Citra Digital
                        </option>

                        <option>
                            Kecerdasan Buatan
                        </option>

                        <option>
                            Rekayasa Perangkat Lunak
                        </option>

                        <option>
                            Internet of Things
                        </option>

                        <option>
                            Jaringan Komputer
                        </option>

                        <option>
                            Lainnya
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Progress (%)</label>

                    <input
                        type="number"
                        id="editProgress"
                        min="0"
                        max="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Tanggal Deadline</label>

                    <input
                        type="date"
                        id="editDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Waktu Deadline</label>

                    <input
                        type="time"
                        id="editTime"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>Catatan</label>

                    <textarea
                        id="editNote"
                        placeholder="Catatan tugas..."
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label>Ganti File</label>

                    <input
                        type="file"
                        id="editFile"
                        accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.rar,.jpg,.jpeg,.png"
                    >

                    <div id="currentFile"></div>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Simpan Perubahan
                </button>

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="closeModal()"
                >
                    Batal
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     NOTIFICATION
========================= -->

<div id="notificationContainer"></div>


<script>

/* =====================================================
   DATA
===================================================== */

let tasks =
    JSON.parse(localStorage.getItem("studentTasks")) || [];

let currentFilter = "all";

let editingId = null;

let calendarDate = new Date();


/* =====================================================
   SIMPAN DATA
===================================================== */

function saveTasks() {

    localStorage.setItem(
        "studentTasks",
        JSON.stringify(tasks)
    );

}


/* =====================================================
   FORMAT TANGGAL INDONESIA
===================================================== */

function formatDate(dateString) {

    const date = new Date(
        dateString + "T00:00:00"
    );

    return date.toLocaleDateString(
        "id-ID",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   FORMAT WAKTU
===================================================== */

function formatTime(time) {

    return time + " WIB";

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now = new Date();

    document.getElementById("dateDisplay").textContent =
        now.toLocaleDateString(
            "id-ID",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    document.getElementById("clock").textContent =
        now.toLocaleTimeString(
            "id-ID"
        ) + " WIB";

}

setInterval(updateClock, 1000);

updateClock();


/* =====================================================
   DEADLINE STATUS
===================================================== */

function getDeadlineStatus(task) {

    if (task.completed) {

        return "safe";

    }

    const deadline =
        new Date(`${task.date}T${task.time}`);

    const now =
        new Date();

    const difference =
        deadline - now;

    if (difference < 0) {

        return "overdue";

    }

    const deadlineDate =
        new Date(
            task.date + "T00:00:00"
        );

    const today =
        new Date();

    today.setHours(0, 0, 0, 0);

    const tomorrow =
        new Date(today);

    tomorrow.setDate(
        tomorrow.getDate() + 1
    );

    if (
        deadlineDate.getTime()
        === today.getTime()
    ) {

        return "today";

    }

    if (
        deadlineDate.getTime()
        === tomorrow.getTime()
    ) {

        return "tomorrow";

    }

    return "safe";

}


/* =====================================================
   PRIORITY OTOMATIS
===================================================== */

function getPriority(task) {

    if (task.completed) {

        return {
            text: "Selesai",
            className: "badge-low"
        };

    }

    const deadline =
        new Date(`${task.date}T${task.time}`);

    const now =
        new Date();

    const hours =
        (deadline - now)
        / (1000 * 60 * 60);

    if (hours < 0) {

        return {
            text: "Terlambat",
            className: "badge-high"
        };

    }

    if (hours <= 24) {

        return {
            text: "Prioritas Tinggi",
            className: "badge-high"
        };

    }

    if (hours <= 72) {

        return {
            text: "Prioritas Sedang",
            className: "badge-medium"
        };

    }

    return {
        text: "Prioritas Rendah",
        className: "badge-low"
    };

}


/* =====================================================
   TAMBAH TUGAS
===================================================== */

document
    .getElementById("taskForm")
    .addEventListener(
        "submit",
        function(e) {

            e.preventDefault();

            const name =
                document.getElementById("taskName").value;

            const category =
                document.getElementById("taskCategory").value;

            const date =
                document.getElementById("taskDate").value;

            const time =
                document.getElementById("taskTime").value;

            const note =
                document.getElementById("taskNote").value;

            const file =
                document.getElementById("taskFile").files[0];

            if (file) {

                convertFileToBase64(
                    file,
                    function(
                        fileData
                    ) {

                        createTask(
                            name,
                            category,
                            date,
                            time,
                            note,
                            file,
                            fileData
                        );

                    }
                );

            } else {

                createTask(
                    name,
                    category,
                    date,
                    time,
                    note,
                    null,
                    null
                );

            }

        }
    );


/* =====================================================
   CREATE TASK
===================================================== */

function createTask(
    name,
    category,
    date,
    time,
    note,
    file,
    fileData
) {

    const task = {

        id: Date.now(),

        name: name,

        category: category,

        date: date,

        time: time,

        progress: 0,

        completed: false,

        note: note,

        fileName:
            file ? file.name : "",

        fileData:
            fileData || "",

        fileType:
            file ? file.type : ""

    };

    tasks.push(task);

    saveTasks();

    document
        .getElementById("taskForm")
        .reset();

    renderTasks();

    renderCalendar();

    updateStatistics();

    showDeadlineNotification(
        "Tugas Berhasil Ditambahkan",
        `Tugas <b>${task.name}</b> berhasil disimpan.`,
        "success"
    );

}


/* =====================================================
   FILE TO BASE64
===================================================== */

function convertFileToBase64(
    file,
    callback
) {

    const reader =
        new FileReader();

    reader.onload =
        function() {

            callback(
                reader.result
            );

        };

    reader.readAsDataURL(file);

}


/* =====================================================
   RENDER TASK
===================================================== */

function renderTasks() {

    const taskList =
        document.getElementById(
            "taskList"
        );

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase();

    let filteredTasks =
        [...tasks];


    /* FILTER */

    if (
        currentFilter ===
        "pending"
    ) {

        filteredTasks =
            filteredTasks.filter(
                task =>
                    !task.completed
            );

    }

    if (
        currentFilter ===
        "completed"
    ) {

        filteredTasks =
            filteredTasks.filter(
                task =>
                    task.completed
            );

    }


    /* SEARCH */

    filteredTasks =
        filteredTasks.filter(
            task =>
                task.name
                    .toLowerCase()
                    .includes(search)
                ||
                task.category
                    .toLowerCase()
                    .includes(search)
        );


    /* SORT DEADLINE */

    filteredTasks.sort(
        function(a, b) {

            return new Date(
                `${a.date}T${a.time}`
            )
            -
            new Date(
                `${b.date}T${b.time}`
            );

        }
    );


    taskList.innerHTML = "";


    if (
        filteredTasks.length === 0
    ) {

        taskList.innerHTML = `

            <div style="
                text-align:center;
                padding:30px;
                color:#64748b;
            ">

                📭 Belum ada tugas.

            </div>

        `;

        return;

    }


    filteredTasks.forEach(
        function(task) {

            const priority =
                getPriority(task);

            const deadlineStatus =
                getDeadlineStatus(task);

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "task-card"
                +
                (
                    task.completed
                        ? " completed"
                        : ""
                );


            let fileHTML = "";

            if (task.fileName) {

                fileHTML = `

                    <div class="task-file">

                        📎
                        <b>${task.fileName}</b>

                        <button
                            class="btn-secondary"
                            onclick="openFile(${task.id})"
                        >
                            Buka
                        </button>

                        <button
                            class="btn-secondary"
                            onclick="downloadFile(${task.id})"
                        >
                            Download
                        </button>

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="task-header">

                    <div>

                        <div class="task-title">

                            ${task.completed ? "✅ " : ""}
                            ${task.name}

                        </div>

                        <div class="task-category">

                            📚 ${task.category}

                        </div>

                    </div>

                    <span
                        class="badge ${priority.className}"
                    >
                        ${priority.text}
                    </span>

                </div>


                <div
                    class="deadline ${deadlineStatus}"
                >

                    🕒 Deadline:
                    ${formatDate(task.date)}
                    -
                    ${formatTime(task.time)}

                </div>


                <div class="progress-area">

                    <div class="progress-info">

                        <span>
                            Progress
                        </span>

                        <span>
                            ${task.progress}%
                        </span>

                    </div>

                    <div class="progress-bar">

                        <div
                            class="progress-fill"
                            style="
                                width:${task.progress}%
                            "
                        ></div>

                    </div>

                </div>


                ${
                    task.note
                    ?
                    `
                    <div class="task-note">

                        📝 ${task.note}

                    </div>
                    `
                    :
                    ""
                }


                ${fileHTML}


                <div class="task-actions">

                    ${
                        !task.completed
                        ?
                        `
                        <button
                            class="btn-success"
                            onclick="completeTask(${task.id})"
                        >
                            ✓ Selesai
                        </button>
                        `
                        :
                        `
                        <button
                            class="btn-secondary"
                            onclick="uncompleteTask(${task.id})"
                        >
                            ↩ Belum Selesai
                        </button>
                        `
                    }


                    <button
                        class="btn-primary"
                        onclick="editTask(${task.id})"
                    >
                        ✏️ Update
                    </button>


                    <button
                        class="btn-danger"
                        onclick="deleteTask(${task.id})"
                    >
                        🗑 Hapus
                    </button>

                </div>

            `;


            taskList.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   COMPLETE TASK
===================================================== */

function completeTask(id) {

    const task =
        tasks.find(
            task =>
                task.id === id
        );

    if (!task) return;

    task.completed = true;

    task.progress = 100;

    saveTasks();

    renderTasks();

    renderCalendar();

    updateStatistics();

}


/* =====================================================
   UNCOMPLETE TASK
===================================================== */

function uncompleteTask(id) {

    const task =
        tasks.find(
            task =>
                task.id === id
        );

    if (!task) return;

    task.completed = false;

    if (
        task.progress === 100
    ) {

        task.progress = 99;

    }

    saveTasks();

    renderTasks();

    renderCalendar();

    updateStatistics();

}


/* =====================================================
   DELETE TASK
===================================================== */

function deleteTask(id) {

    const task =
        tasks.find(
            task =>
                task.id === id
        );

    if (!task) return;


    const confirmation =
        confirm(
            `Hapus tugas "${task.name}"?`
        );


    if (!confirmation) {

        return;

    }


    tasks =
        tasks.filter(
            task =>
                task.id !== id
        );


    saveTasks();

    renderTasks();

    renderCalendar();

    updateStatistics();

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(filter) {

    currentFilter = filter;

    document
        .getElementById(
            "filterAll"
        )
        .classList.remove(
            "active"
        );

    document
        .getElementById(
            "filterPending"
        )
        .classList.remove(
            "active"
        );

    document
        .getElementById(
            "filterCompleted"
        )
        .classList.remove(
            "active"
        );


    if (filter === "all") {

        document
            .getElementById(
                "filterAll"
            )
            .classList.add(
                "active"
            );

    }

    if (filter === "pending") {

        document
            .getElementById(
                "filterPending"
            )
            .classList.add(
                "active"
            );

    }

    if (filter === "completed") {

        document
            .getElementById(
                "filterCompleted"
            )
            .classList.add(
                "active"
            );

    }


    renderTasks();

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics() {

    document
        .getElementById(
            "totalTasks"
        )
        .textContent =
            tasks.length;


    document
        .getElementById(
            "completedTasks"
        )
        .textContent =
            tasks.filter(
                task =>
                    task.completed
            ).length;


    document
        .getElementById(
            "pendingTasks"
        )
        .textContent =
            tasks.filter(
                task =>
                    !task.completed
            ).length;

}


/* =====================================================
   EDIT TASK
===================================================== */

function editTask(id) {

    const task =
        tasks.find(
            task =>
                task.id === id
        );

    if (!task) return;


    editingId = id;


    document
        .getElementById(
            "editName"
        )
        .value =
            task.name;


    document
        .getElementById(
            "editCategory"
        )
        .value =
            task.category;


    document
        .getElementById(
            "editProgress"
        )
        .value =
            task.progress;


    document
        .getElementById(
            "editDate"
        )
        .value =
            task.date;


    document
        .getElementById(
            "editTime"
        )
        .value =
            task.time;


    document
        .getElementById(
            "editNote"
        )
        .value =
            task.note || "";


    document
        .getElementById(
            "currentFile"
        )
        .innerHTML =
            task.fileName
            ?
            `
                <p style="
                    margin-top:8px;
                    color:#2563eb;
                ">
                    📎 File saat ini:
                    <b>${task.fileName}</b>
                </p>
            `
            :
            `
                <p style="
                    margin-top:8px;
                    color:#64748b;
                ">
                    Belum ada file.
                </p>
            `;


    document
        .getElementById(
            "editModal"
        )
        .style.display =
            "flex";

}


/* =====================================================
   UPDATE TASK
===================================================== */

document
    .getElementById(
        "editForm"
    )
    .addEventListener(
        "submit",
        function(e) {

            e.preventDefault();


            const task =
                tasks.find(
                    task =>
                        task.id === editingId
                );


            if (!task) return;


            task.name =
                document
                    .getElementById(
                        "editName"
                    )
                    .value;


            task.category =
                document
                    .getElementById(
                        "editCategory"
                    )
                    .value;


            task.progress =
                parseInt(
                    document
                        .getElementById(
                            "editProgress"
                        )
                        .value
                );


            task.date =
                document
                    .getElementById(
                        "editDate"
                    )
                    .value;


            task.time =
                document
                    .getElementById(
                        "editTime"
                    )
                    .value;


            task.note =
                document
                    .getElementById(
                        "editNote"
                    )
                    .value;


            if (
                task.progress >= 100
            ) {

                task.progress = 100;

                task.completed = true;

            } else {

                task.completed = false;

            }


            const file =
                document
                    .getElementById(
                        "editFile"
                    )
                    .files[0];


            if (file) {

                convertFileToBase64(
                    file,
                    function(
                        fileData
                    ) {

                        task.fileName =
                            file.name;

                        task.fileData =
                            fileData;

                        task.fileType =
                            file.type;


                        saveTasks();

                        closeModal();

                        renderTasks();

                        renderCalendar();

                        updateStatistics();

                    }
                );

            } else {

                saveTasks();

                closeModal();

                renderTasks();

                renderCalendar();

                updateStatistics();

            }

        }
    );


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

    document
        .getElementById(
            "editModal"
        )
        .style.display =
            "none";

    document
        .getElementById(
            "editForm"
        )
        .reset();

    editingId = null;

}


/* =====================================================
   OPEN FILE
===================================================== */

function openFile(id) {

    const task =
        tasks.find(
            task =>
                task.id === id
        );

    if (
        !task ||
        !task.fileData
    ) {

        alert(
            "File tidak tersedia."
        );

        return;

    }


    const newWindow =
        window.open();


    if (
        task.fileType.startsWith(
            "image/"
        )
    ) {

        newWindow.document.write(`

            <img
                src="${task.fileData}"
                style="
                    max-width:100%;
                    display:block;
                    margin:auto;
                "
            >

        `);

    }

    else if (
        task.fileType ===
        "application/pdf"
    ) {

        newWindow.document.write(`

            <iframe
                src="${task.fileData}"
                style="
                    width:100%;
                    height:100vh;
                    border:none;
                "
            ></iframe>

        `);

    }

    else {

        newWindow.document.write(`

            <div style="
                font-family:Arial;
                padding:30px;
                text-align:center;
            ">

                <h2>
                    📎 ${task.fileName}
                </h2>

                <p>
                    File ini dapat diunduh.
                </p>

                <a
                    href="${task.fileData}"
                    download="${task.fileName}"
                >

                    Download File

                </a>

            </div>

        `);

    }

}


/* =====================================================
   DOWNLOAD FILE
===================================================== */

function downloadFile(id) {

    const task =
        tasks.find(
            task =>
                task.id === id
        );

    if (
        !task ||
        !task.fileData
    ) {

        alert(
            "File tidak tersedia."
        );

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        task.fileData;

    link.download =
        task.fileName;


    document
        .body
        .appendChild(link);


    link.click();


    link.remove();

}


/* =====================================================
   CALENDAR
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();


    document
        .getElementById(
            "calendarTitle"
        )
        .textContent =
            new Date(
                year,
                month,
                1
            ).toLocaleDateString(
                "id-ID",
                {
                    month: "long",
                    year: "numeric"
                }
            );


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    calendar.innerHTML = "";


    const dayNames = [
        "Min",
        "Sen",
        "Sel",
        "Rab",
        "Kam",
        "Jum",
        "Sab"
    ];


    dayNames.forEach(
        function(day) {

            calendar.innerHTML += `

                <div class="day-name">
                    ${day}
                </div>

            `;

        }
    );


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        calendar.innerHTML += `

            <div></div>

        `;

    }


    const today =
        new Date();


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "calendar-day";


        if (
            day === today.getDate()
            &&
            month === today.getMonth()
            &&
            year === today.getFullYear()
        ) {

            cell.classList.add(
                "today"
            );

        }


        cell.innerHTML = `

            <div class="day-number">
                ${day}
            </div>

        `;


        const dateString =
            `${year}-${String(
                month + 1
            ).padStart(2, "0")}-${String(
                day
            ).padStart(2, "0")}`;


        const dayTasks =
            tasks.filter(
                task =>
                    task.date ===
                    dateString
            );


        dayTasks.forEach(
            function(task) {

                const taskElement =
                    document.createElement(
                        "div"
                    );


                taskElement.className =
                    "calendar-task";


                taskElement.textContent =
                    task.name;


                taskElement.title =
                    "Klik untuk update tugas";


                taskElement.onclick =
                    function() {

                        editTask(
                            task.id
                        );

                    };


                cell.appendChild(
                    taskElement
                );

            }
        );


        calendar.appendChild(
            cell
        );

    }

}


/* =====================================================
   CALENDAR NAVIGATION
===================================================== */

function previousMonth() {

    calendarDate.setMonth(
        calendarDate.getMonth() - 1
    );

    renderCalendar();

}


function nextMonth() {

    calendarDate.setMonth(
        calendarDate.getMonth() + 1
    );

    renderCalendar();

}


function goToday() {

    calendarDate =
        new Date();

    renderCalendar();

}


/* =====================================================
   NOTIFICATION POPUP
===================================================== */

function showDeadlineNotification(
    title,
    message,
    type = "warning"
) {

    const container =
        document.getElementById(
            "notificationContainer"
        );


    const notification =
        document.createElement(
            "div"
        );


    notification.className =
        `deadline-notification ${type}`;


    notification.innerHTML = `

        <button
            class="notification-close"
            onclick="
                this.parentElement.remove()
            "
        >
            ×
        </button>

        <div class="notification-title">

            🔔 ${title}

        </div>

        <div class="notification-message">

            ${message}

        </div>

    `;


    container.appendChild(
        notification
    );


    setTimeout(
        function() {

            notification.remove();

        },
        8000
    );

}


/* =====================================================
   BROWSER NOTIFICATION
===================================================== */

function requestNotificationPermission() {

    if (
        "Notification" in window
    ) {

        if (
            Notification.permission ===
            "default"
        ) {

            Notification.requestPermission();

        }

    }

}


function showBrowserNotification(
    title,
    message
) {

    if (
        "Notification" in window
        &&
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            title,
            {
                body: message,
                icon: ""
            }
        );

    }

}


/* =====================================================
   CEK DEADLINE
===================================================== */

function checkDeadlineNotifications() {

    const now =
        new Date();


    let notifiedTasks =
        JSON.parse(
            localStorage.getItem(
                "deadlineNotifications"
            )
        ) || {};


    tasks.forEach(
        function(task) {

            if (
                task.completed
            ) {

                return;

            }


            const deadline =
                new Date(
                    `${task.date}T${task.time}`
                );


            const difference =
                deadline - now;


            const hoursLeft =
                difference
                /
                (1000 * 60 * 60);


            let type = null;

            let title = "";

            let message = "";


            /* =========================
               TERLAMBAT
            ========================= */

            if (
                difference < 0
            ) {

                type =
                    "danger";

                title =
                    "Deadline Terlewat!";

                message =
                    `Tugas "${task.name}" sudah melewati deadline.`;

            }


            /* =========================
               1 JAM
            ========================= */

            else if (
                hoursLeft <= 1
            ) {

                type =
                    "danger";

                title =
                    "Deadline 1 Jam Lagi!";

                message =
                    `Tugas "${task.name}" akan segera jatuh tempo.`;

            }


            /* =========================
               1 HARI
            ========================= */

            else if (
                hoursLeft <= 24
            ) {

                type =
                    "warning";

                title =
                    "Deadline Besok!";

                message =
                    `Tugas "${task.name}" harus dikumpulkan dalam waktu kurang dari 24 jam.`;

            }


            /* =========================
               3 HARI
            ========================= */

            else if (
                hoursLeft <= 72
            ) {

                type =
                    "warning";

                title =
                    "Deadline 3 Hari Lagi!";

                message =
                    `Tugas "${task.name}" memiliki deadline dalam 3 hari.`;

            }


            if (
                type
            ) {

                const notificationKey =
                    `${task.id}-${type}`;


                if (
                    !notifiedTasks[
                        notificationKey
                    ]
                ) {

                    showDeadlineNotification(
                        title,
                        message,
                        type
                    );


                    showBrowserNotification(
                        title,
                        message
                    );


                    notifiedTasks[
                        notificationKey
                    ] = true;


                    localStorage.setItem(
                        "deadlineNotifications",
                        JSON.stringify(
                            notifiedTasks
                        )
                    );

                }

            }

        }
    );

}


/* =====================================================
   JALANKAN NOTIFIKASI
===================================================== */

requestNotificationPermission();


setTimeout(
    function() {

        checkDeadlineNotifications();

    },
    1000
);


/* Cek setiap 1 menit */

setInterval(
    function() {

        checkDeadlineNotifications();

    },
    60000
);


/* =====================================================
   INITIAL RENDER
===================================================== */

renderTasks();

renderCalendar();

updateStatistics();

</script>

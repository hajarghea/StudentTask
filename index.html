<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentTask - To Do List Mahasiswa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
            font-size: 14px;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            height: 62px;
            display: flex;
            align-items: center;
        }

        .header-inner {
            width: min(1180px, 94%);
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 700;
            color: #2563eb;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: #2563eb;
            color: white;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .date-display {
            color: #64748b;
            font-size: 12px;
        }

        .clock {
            color: #1e293b;
            font-size: 13px;
            font-weight: 600;
        }

        .notification-btn {
            width: 34px;
            height: 34px;
            border: 1px solid #dbe3ef;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: min(1180px, 94%);
            margin: 20px auto 35px;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            background: white;
            border-radius: 12px;
            padding: 18px 20px;
            border: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }

        .welcome h2 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #0f172a;
        }

        .welcome p {
            color: #64748b;
            font-size: 13px;
        }

        /* =========================
           STATISTICS
        ========================= */

        .statistics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 11px;
            padding: 15px 17px;
        }

        .stat-card h3 {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
        }

        .stat-card:nth-child(2) .stat-number {
            color: #f59e0b;
        }

        .stat-card:nth-child(3) .stat-number {
            color: #16a34a;
        }

        /* =========================
           SECTION
        ========================= */

        .section {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title h2 {
            font-size: 17px;
            color: #0f172a;
        }

        /* =========================
           CALENDAR
        ========================= */

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            font-size: 16px;
            color: #1e293b;
        }

        .calendar-navigation {
            display: flex;
            gap: 6px;
        }

        .calendar-navigation button {
            width: 31px;
            height: 30px;
            border: 1px solid #dbe3ef;
            background: white;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .calendar-navigation button:hover {
            background: #eff6ff;
            border-color: #93c5fd;
        }

        .calendar-weekdays,
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-weekdays div {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            padding: 5px 0;
        }

        .calendar-day {
            min-height: 57px;
            border: 1px solid #edf1f6;
            border-radius: 7px;
            padding: 6px;
            position: relative;
            background: #ffffff;
        }

        .calendar-day:hover {
            border-color: #93c5fd;
            background: #f8fbff;
        }

        .calendar-day.empty {
            background: #f8fafc;
        }

        .calendar-day.today {
            border: 2px solid #2563eb;
        }

        .day-number {
            font-size: 12px;
            font-weight: 600;
            color: #334155;
        }

        .calendar-task {
            margin-top: 4px;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================
           FORM
        ========================= */

        .task-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 13px 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #dbe3ef;
            border-radius: 7px;
            padding: 9px 10px;
            font-size: 13px;
            outline: none;
            background: white;
            color: #1e293b;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.08);
        }

        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        /* =========================
           CHECKLIST INPUT
        ========================= */

        .checklist-input {
            display: flex;
            gap: 7px;
        }

        .checklist-input input {
            flex: 1;
        }

        .btn-add {
            border: none;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 7px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add:hover {
            background: #dbeafe;
        }

        .checklist-list {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #edf1f6;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .checklist-remove {
            border: none;
            background: transparent;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
        }

        /* =========================
           FILE
        ========================= */

        .file-help {
            color: #94a3b8;
            font-size: 10px;
            margin-top: 5px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 2px;
        }

        .btn {
            border: none;
            border-radius: 7px;
            padding: 9px 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* =========================
           TASK LIST HEADER
        ========================= */

        .task-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #dbe3ef;
            border-radius: 7px;
            font-size: 13px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2563eb;
        }

        .filters {
            display: flex;
            gap: 5px;
        }

        .filter-btn {
            border: 1px solid #dbe3ef;
            background: white;
            color: #64748b;
            border-radius: 7px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        /* =========================
           TASK GRID
        ========================= */

        #taskList {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .task-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            background: white;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 12px 18px;
            transition: 0.2s;
        }

        .task-card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
        }

        .task-card.completed {
            background: #f8fafc;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .task-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .task-category {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 4px 7px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 600;
        }

        .priority {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 4px;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .priority-low {
            background: #dcfce7;
            color: #16a34a;
        }

        .deadline {
            margin-top: 9px;
            font-size: 12px;
            color: #64748b;
        }

        .deadline.overdue {
            color: #dc2626;
            font-weight: 600;
        }

        .deadline.soon {
            color: #d97706;
            font-weight: 600;
        }

        .progress-info {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 5px;
            transition: width 0.3s;
        }

        .checklist-display {
            margin-top: 10px;
        }

        .checklist-display h4 {
            font-size: 12px;
            margin-bottom: 6px;
            color: #334155;
        }

        .task-check-item {
            display: flex;
            gap: 7px;
            align-items: flex-start;
            margin-bottom: 5px;
            font-size: 12px;
            color: #475569;
        }

        .task-check-item input {
            margin-top: 2px;
            accent-color: #2563eb;
        }

        .task-note {
            margin-top: 9px;
            background: #f8fafc;
            border-left: 3px solid #93c5fd;
            padding: 7px 9px;
            font-size: 12px;
            color: #64748b;
            border-radius: 4px;
        }

        .task-file {
            margin-top: 8px;
            font-size: 11px;
            color: #2563eb;
            cursor: pointer;
        }

        .task-actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        .task-action-btn {
            border: 1px solid #dbe3ef;
            background: white;
            color: #475569;
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
        }

        .task-action-btn:hover {
            background: #f8fafc;
        }

        .task-action-btn.complete {
            color: #16a34a;
            border-color: #bbf7d0;
        }

        .task-action-btn.edit {
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .task-action-btn.delete {
            color: #dc2626;
            border-color: #fecaca;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 35px 20px;
            color: #94a3b8;
        }

        .empty-state-icon {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .empty-state h3 {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 12px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: min(580px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 18px;
            color: #0f172a;
        }

        .close-modal {
            border: none;
            background: transparent;
            font-size: 22px;
            color: #64748b;
            cursor: pointer;
        }

        .edit-form {
            display: grid;
            gap: 12px;
        }

        /* =========================
           NOTIFICATION
        ========================= */

        #notificationContainer {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: min(320px, calc(100% - 36px));
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .notification {
            background: white;
            border: 1px solid #dbe3ef;
            border-left: 4px solid #2563eb;
            border-radius: 8px;
            padding: 11px 13px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.1);
            font-size: 12px;
        }

        .notification.warning {
            border-left-color: #f59e0b;
        }

        .notification.danger {
            border-left-color: #ef4444;
        }

        /* =========================
           RESPONSIVE TABLET
        ========================= */

        @media (max-width: 900px) {
            #taskList {
                grid-template-columns: 1fr;
            }

            .task-card {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* =========================
           RESPONSIVE MOBILE
        ========================= */

        @media (max-width: 700px) {
            header {
                height: auto;
                padding: 11px 0;
            }

            .header-inner {
                width: 92%;
            }

            .date-display {
                display: none;
            }

            .logo {
                font-size: 17px;
            }

            .logo-icon {
                width: 32px;
                height: 32px;
            }

            .container {
                width: 92%;
                margin-top: 14px;
            }

            .welcome {
                padding: 15px;
            }

            .welcome h2 {
                font-size: 18px;
            }

            .statistics {
                gap: 8px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-number {
                font-size: 21px;
            }

            .section {
                padding: 14px;
            }

            .task-form {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .form-actions {
                grid-column: auto;
                justify-content: stretch;
            }

            .form-actions .btn {
                flex: 1;
            }

            .task-list-header {
                flex-direction: column;
                align-items: stretch;
            }

            .filters {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .filter-btn {
                width: 100%;
            }

            #taskList {
                grid-template-columns: 1fr;
            }

            .task-card {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .task-actions {
                justify-content: stretch;
            }

            .task-action-btn {
                flex: 1;
            }

            .calendar-day {
                min-height: 48px;
                padding: 5px;
            }

            .calendar-task {
                display: none;
            }

            .calendar-weekdays div {
                font-size: 10px;
            }
        }

        /* =========================
           VERY SMALL MOBILE
        ========================= */

        @media (max-width: 420px) {
            .statistics {
                grid-template-columns: 1fr;
            }

            .statistics .stat-card {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .statistics .stat-card h3 {
                margin-bottom: 0;
            }

            .header-right {
                gap: 7px;
            }

            .clock {
                font-size: 11px;
            }

            .calendar-weekdays,
            .calendar-days {
                gap: 3px;
            }

            .calendar-day {
                min-height: 42px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            <div class="logo-icon">✓</div>
            <span>StudentTask</span>
        </div>

        <div class="header-right">
            <div class="date-display" id="dateDisplay"></div>
            <div class="clock" id="clock"></div>

            <button class="notification-btn" onclick="requestNotificationPermission()">
                🔔
            </button>
        </div>

    </div>
</header>


<main class="container">

    <!-- WELCOME -->
    <section class="welcome">
        <h2>Halo, Mahasiswa! 👋</h2>
        <p>Kelola tugas kuliahmu dengan lebih teratur dan mudah.</p>
    </section>


    <!-- STATISTICS -->
    <section class="statistics">

        <div class="stat-card">
            <div>
                <h3>Total Tugas</h3>
                <div class="stat-number" id="totalTasks">0</div>
            </div>
        </div>

        <div class="stat-card">
            <div>
                <h3>Belum Selesai</h3>
                <div class="stat-number" id="pendingTasks">0</div>
            </div>
        </div>

        <div class="stat-card">
            <div>
                <h3>Selesai</h3>
                <div class="stat-number" id="completedTasks">0</div>
            </div>
        </div>

    </section>


    <!-- CALENDAR -->
    <section class="section">

        <div class="calendar-header">

            <h3 id="calendarTitle">September 2026</h3>

            <div class="calendar-navigation">
                <button onclick="changeMonth(-1)">‹</button>
                <button onclick="changeMonth(1)">›</button>
            </div>

        </div>

        <div class="calendar-weekdays">
            <div>Min</div>
            <div>Sen</div>
            <div>Sel</div>
            <div>Rab</div>
            <div>Kam</div>
            <div>Jum</div>
            <div>Sab</div>
        </div>

        <div class="calendar-days" id="calendarDays"></div>

    </section>


    <!-- ADD TASK -->
    <section class="section">

        <div class="section-title">
            <h2>Tambah Tugas</h2>
        </div>

        <form id="taskForm" class="task-form">

            <div class="form-group">
                <label for="taskName">Nama Tugas</label>
                <input
                    type="text"
                    id="taskName"
                    placeholder="Tambah Tugas"
                    required
                >
            </div>


            <div class="form-group">
                <label for="taskCourse">Mata Kuliah</label>

                <select id="taskCourse" required>
                    <option value="">Pilih mata kuliah</option>
                    <option value="Pemrograman Web">Pemrograman Web</option>
                    <option value="Basis Data">Basis Data</option>
                    <option value="Pengolahan Citra Digital">
                        Pengolahan Citra Digital
                    </option>
                    <option value="Kecerdasan Buatan">
                        Kecerdasan Buatan
                    </option>
                    <option value="Rekayasa Perangkat Lunak">
                        Rekayasa Perangkat Lunak
                    </option>
                    <option value="Jaringan Komputer">
                        Jaringan Komputer
                    </option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>


            <div class="form-group">
                <label for="taskDate">Deadline</label>
                <input type="date" id="taskDate" required>
            </div>


            <div class="form-group">
                <label for="taskTime">Waktu</label>
                <input type="time" id="taskTime" required>
            </div>


            <div class="form-group full">

                <label>Checklist / Subtugas</label>

                <div class="checklist-input">
                    <input
                        type="text"
                        id="checklistInput"
                        placeholder="Tambahkan subtugas..."
                    >

                    <button
                        type="button"
                        class="btn-add"
                        onclick="addChecklistItem()"
                    >
                        + Tambah
                    </button>
                </div>

                <div
                    id="addChecklistList"
                    class="checklist-list"
                ></div>

            </div>


            <div class="form-group full">

                <label for="taskNote">Catatan</label>

                <textarea
                    id="taskNote"
                    placeholder="Tambahkan catatan tugas..."
                ></textarea>

            </div>


            <div class="form-group full">

                <label for="taskFile">File Tugas</label>

                <input
                    type="file"
                    id="taskFile"
                >

                <div class="file-help">
                    File akan disimpan secara lokal di browser.
                </div>

            </div>

    <!-- TASK LIST -->
    <section class="section">

</main>

                <div class="checklist-input">

                >

<!-- NOTIFICATION -->
<div id="notificationContainer"></div>


<script>

    /* =========================
       DATA
    ========================= */

    let tasks =
        JSON.parse(localStorage.getItem("studentTasks")) || [];

    let currentFilter = "all";

    let editingId = null;

    let calendarDate = new Date();

    let addChecklistItems = [];

    let editChecklistItems = [];


    /* =========================
       LOCAL STORAGE
    ========================= */

    function saveTasks() {

        localStorage.setItem(
            "studentTasks",
            JSON.stringify(tasks)
        );

    }


    /* =========================
       DATE & CLOCK
    ========================= */

    function updateDateTime() {

        const now = new Date();

        const date = now.toLocaleDateString(
            "id-ID",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric",
                timeZone: "Asia/Jakarta"
            }
        );

        const time = now.toLocaleTimeString(
            "id-ID",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                timeZone: "Asia/Jakarta"
            }
        );

        document.getElementById("dateDisplay").textContent = date;

        document.getElementById("clock").textContent = time;

    }


    setInterval(updateDateTime, 1000);

    updateDateTime();


    /* =========================
       PRIORITY
    ========================= */

    function getPriority(date, time) {

        const deadline =
            new Date(`${date}T${time}`);

        const now = new Date();

        const diff =
            deadline - now;

        const hours =
            diff / (1000 * 60 * 60);

        if (hours < 24) {

            return {
                label: "Tinggi",
                class: "priority-high"
            };

        }

        if (hours < 72) {

            return {
                label: "Sedang",
                class: "priority-medium"
            };

        }

        return {
            label: "Rendah",
            class: "priority-low"
        };

    }


    /* =========================
       DEADLINE STATUS
    ========================= */

    function getDeadlineStatus(date, time) {

        const deadline =
            new Date(`${date}T${time}`);

        const now = new Date();

        const diff =
            deadline - now;

        const hours =
            diff / (1000 * 60 * 60);

        if (diff < 0) {

            return {
                text: "Terlambat",
                class: "overdue"
            };

        }

        if (hours <= 24) {

            return {
                text: "Deadline < 24 jam",
                class: "soon"
            };

        }

        return {
            text: "Masih tersedia",
            class: ""
        };

    }


    /* =========================
       FORMAT DATE
    ========================= */

    function formatDate(date, time) {

        const d =
            new Date(`${date}T${time}`);

        return d.toLocaleDateString(
            "id-ID",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        ) + " • " + time;

    }


    /* =========================
       CHECKLIST
    ========================= */

    function addChecklistItem() {

        const input =
            document.getElementById("checklistInput");

        const value =
            input.value.trim();

        if (!value) return;

        addChecklistItems.push({
            id: Date.now(),
            text: value,
            completed: false
        });

        input.value = "";

        renderAddChecklist();

    }


    function renderAddChecklist() {

        const container =
            document.getElementById("addChecklistList");

        container.innerHTML = "";

        addChecklistItems.forEach(item => {

            const div =
                document.createElement("div");

            div.className = "checklist-item";

            div.innerHTML = `
                <span>${escapeHtml(item.text)}</span>

                <button
                    type="button"
                    class="checklist-remove"
                    onclick="removeAddChecklist(${item.id})"
                >
                    ×
                </button>
            `;

            container.appendChild(div);

        });

    }


    function removeAddChecklist(id) {

        addChecklistItems =
            addChecklistItems.filter(
                item => item.id !== id
            );

        renderAddChecklist();

    }


    function resetAddForm() {

        addChecklistItems = [];

        renderAddChecklist();

    }


    /* =========================
       ADD TASK
    ========================= */

    document
        .getElementById("taskForm")
        .addEventListener("submit", async function(e) {

            e.preventDefault();

            const name =
                document.getElementById("taskName").value.trim();

            const course =
                document.getElementById("taskCourse").value;

            const date =
                document.getElementById("taskDate").value;

            const time =
                document.getElementById("taskTime").value;

            const note =
                document.getElementById("taskNote").value.trim();

            const fileInput =
                document.getElementById("taskFile");

            let file = null;

            if (fileInput.files.length > 0) {

                const selectedFile =
                    fileInput.files[0];

                file = await fileToBase64(
                    selectedFile
                );

            }

            const task = {

                id: Date.now(),

                name,

                course,

                date,

                time,

                checklist:
                    JSON.parse(
                        JSON.stringify(addChecklistItems)
                    ),

                note,

                file,

                completed: false,

                createdAt:
                    new Date().toISOString()

            };

            tasks.push(task);

            saveTasks();

            this.reset();

            resetAddForm();

            renderTasks();

            renderCalendar();

            updateStatistics();

            showNotification(
                "Tugas berhasil ditambahkan!"
            );

        });


    /* =========================
       FILE TO BASE64
    ========================= */

    function fileToBase64(file) {

        return new Promise((resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => {

                    resolve({
                        name: file.name,
                        type: file.type,
                        data: reader.result
                    });

                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        });

    }


    /* =========================
       RENDER TASKS
    ========================= */

    function renderTasks() {

        const container =
            document.getElementById("taskList");

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

        let filtered =
            [...tasks];

        if (currentFilter === "pending") {

            filtered =
                filtered.filter(
                    task => !task.completed
                );

        }

        if (currentFilter === "completed") {

            filtered =
                filtered.filter(
                    task => task.completed
                );

        }

        if (search) {

            filtered =
                filtered.filter(task =>

                    task.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    task.course
                        .toLowerCase()
                        .includes(search)

                );

        }

        filtered.sort(
            (a, b) =>
                new Date(`${a.date}T${a.time}`)
                -
                new Date(`${b.date}T${b.time}`)
        );

        container.innerHTML = "";

        if (filtered.length === 0) {

            container.innerHTML = `

                <div class="empty-state">

                    <div class="empty-state-icon">
                        📝
                    </div>

                    <h3>Belum ada tugas</h3>

                    <p>
                        Tambahkan tugas untuk mulai mengatur aktivitas kuliahmu.
                    </p>

                </div>

            `;

            return;

        }

        filtered.forEach(task => {

            container.appendChild(
                createTaskCard(task)
            );

        });

    }


    /* =========================
       CREATE TASK CARD
    ========================= */

    function createTaskCard(task) {

        const card =
            document.createElement("div");

        card.className =
            "task-card" +
            (task.completed
                ? " completed"
                : "");

        const priority =
            getPriority(
                task.date,
                task.time
            );

        const deadline =
            getDeadlineStatus(
                task.date,
                task.time
            );

        const checklist =
            task.checklist || [];

        const completedChecklist =
            checklist.filter(
                item => item.completed
            ).length;

        const totalChecklist =
            checklist.length;

        const progress =
            totalChecklist > 0
                ? Math.round(
                    completedChecklist /
                    totalChecklist *
                    100
                )
                : task.completed
                    ? 100
                    : 0;

        let checklistHtml = "";

        if (checklist.length > 0) {

            checklistHtml = `

                <div class="checklist-display">

                    <h4>
                        Checklist
                        (${completedChecklist}/${totalChecklist})
                    </h4>

                    ${checklist.map(item => `

                        <label class="task-check-item">

                            <input
                                type="checkbox"
                                ${item.completed ? "checked" : ""}
                                onchange="
                                    toggleChecklist(
                                        ${task.id},
                                        ${item.id}
                                    )
                                "
                            >

                            <span>
                                ${escapeHtml(item.text)}
                            </span>

                        </label>

                    `).join("")}

                </div>

                <div class="progress-info">
                    Progress ${progress}%
                </div>

                <div class="progress-bar">
                    <div
                        class="progress-fill"
                        style="width:${progress}%"
                    ></div>
                </div>

            `;

        }


        let noteHtml = "";

        if (task.note) {

            noteHtml = `

                <div class="task-note">
                    ${escapeHtml(task.note)}
                </div>

            `;

        }


        let fileHtml = "";

        if (task.file) {

            fileHtml = `

                <div
                    class="task-file"
                    onclick="openFile(${task.id})"
                >
                    📎 ${escapeHtml(task.file.name)}
                </div>

            `;

        }


        card.innerHTML = `

            <div>

                <div class="task-title">
                    ${escapeHtml(task.name)}
                </div>

                <span class="task-category">
                    ${escapeHtml(task.course)}
                </span>

                <span class="priority ${priority.class}">
                    Prioritas ${priority.label}
                </span>

                <div class="deadline ${deadline.class}">
                    📅 ${formatDate(task.date, task.time)}
                    <br>
                    ${deadline.text}
                </div>

                ${noteHtml}

                ${fileHtml}

            </div>


            <div>

                ${checklistHtml}

            </div>


            <div class="task-actions">

                <button
                    class="task-action-btn complete"
                    onclick="toggleTask(${task.id})"
                >
                    ${task.completed
                        ? "↩ Buka"
                        : "✓ Selesai"}
                </button>

                <button
                    class="task-action-btn edit"
                    onclick="openEditModal(${task.id})"
                >
                    ✎ Edit
                </button>

                <button
                    class="task-action-btn delete"
                    onclick="deleteTask(${task.id})"
                >
                    🗑 Hapus
                </button>

            </div>

        `;

        return card;

    }


    /* =========================
       TOGGLE CHECKLIST
    ========================= */

    function toggleChecklist(taskId, itemId) {

        const task =
            tasks.find(
                task => task.id === taskId
            );

        if (!task) return;

        const item =
            task.checklist.find(
                item => item.id === itemId
            );

        if (!item) return;

        item.completed =
            !item.completed;

        saveTasks();

        updateTaskCompletion(task);

        renderTasks();

        updateStatistics();

    }


    function updateTaskCompletion(task) {

        if (
            task.checklist &&
            task.checklist.length > 0
        ) {

            const allDone =
                task.checklist.every(
                    item => item.completed
                );

            task.completed =
                allDone;

        }

        saveTasks();

    }


    /* =========================
       TOGGLE TASK
    ========================= */

    function toggleTask(id) {

        const task =
            tasks.find(
                task => task.id === id
            );

        if (!task) return;

        task.completed =
            !task.completed;

        saveTasks();

        renderTasks();

        renderCalendar();

        updateStatistics();

        showNotification(
            task.completed
                ? "Tugas ditandai selesai."
                : "Tugas dikembalikan ke belum selesai."
        );

    }


    /* =========================
       DELETE
    ========================= */

    function deleteTask(id) {

        const task =
            tasks.find(
                task => task.id === id
            );

        if (!task) return;

        const confirmDelete =
            confirm(
                `Hapus tugas "${task.name}"?`
            );

        if (!confirmDelete) return;

        tasks =
            tasks.filter(
                task => task.id !== id
            );

        saveTasks();

        renderTasks();

        renderCalendar();

        updateStatistics();

        showNotification(
            "Tugas berhasil dihapus."
        );

    }


    /* =========================
       FILTER
    ========================= */

    function setFilter(filter) {

        currentFilter =
            filter;

        document
            .querySelectorAll(".filter-btn")
            .forEach(button =>
                button.classList.remove("active")
            );

        if (filter === "all") {

            document
                .getElementById("filterAll")
                .classList.add("active");

        }

        if (filter === "pending") {

            document
                .getElementById("filterPending")
                .classList.add("active");

        }

        if (filter === "completed") {

            document
                .getElementById("filterCompleted")
                .classList.add("active");

        }

        renderTasks();

    }


    /* =========================
       STATISTICS
    ========================= */

    function updateStatistics() {

        const total =
            tasks.length;

        const completed =
            tasks.filter(
                task => task.completed
            ).length;

        const pending =
            total - completed;

        document
            .getElementById("totalTasks")
            .textContent = total;

        document
            .getElementById("pendingTasks")
            .textContent = pending;

        document
            .getElementById("completedTasks")
            .textContent = completed;

    }


    /* =========================
       EDIT MODAL
    ========================= */

    function openEditModal(id) {

        const task =
            tasks.find(
                task => task.id === id
            );

        if (!task) return;

        editingId = id;

        document
            .getElementById("editTaskName")
            .value = task.name;

        document
            .getElementById("editTaskCourse")
            .value = task.course;

        document
            .getElementById("editTaskDate")
            .value = task.date;

        document
            .getElementById("editTaskTime")
            .value = task.time;

        document
            .getElementById("editTaskNote")
            .value = task.note || "";

        editChecklistItems =
            JSON.parse(
                JSON.stringify(
                    task.checklist || []
                )
            );

        renderEditChecklist();

        document
            .getElementById("editModal")
            .classList.add("show");

    }


    function closeEditModal() {

        document
            .getElementById("editModal")
            .classList.remove("show");

        editingId = null;

    }


    /* =========================
       EDIT CHECKLIST
    ========================= */

    function addEditChecklistItem() {

        const input =
            document.getElementById(
                "editChecklistInput"
            );

        const value =
            input.value.trim();

        if (!value) return;

        editChecklistItems.push({

            id: Date.now(),

            text: value,

            completed: false

        });

        input.value = "";

        renderEditChecklist();

    }


    function renderEditChecklist() {

        const container =
            document.getElementById(
                "editChecklistList"
            );

        container.innerHTML = "";

        editChecklistItems.forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "checklist-item";

            div.innerHTML = `

                <span>
                    ${escapeHtml(item.text)}
                </span>

                <button
                    type="button"
                    class="checklist-remove"
                    onclick="removeEditChecklist(${item.id})"
                >
                    ×
                </button>

            `;

            container.appendChild(div);

        });

    }


    function removeEditChecklist(id) {

        editChecklistItems =
            editChecklistItems.filter(
                item => item.id !== id
            );

        renderEditChecklist();

    }


    /* =========================
       SAVE EDIT
    ========================= */

    document
        .getElementById("editForm")
        .addEventListener("submit", async function(e) {

            e.preventDefault();

            const task =
                tasks.find(
                    task => task.id === editingId
                );

            if (!task) return;

            task.name =
                document
                    .getElementById("editTaskName")
                    .value.trim();

            task.course =
                document
                    .getElementById("editTaskCourse")
                    .value;

            task.date =
                document
                    .getElementById("editTaskDate")
                    .value;

            task.time =
                document
                    .getElementById("editTaskTime")
                    .value;

            task.note =
                document
                    .getElementById("editTaskNote")
                    .value.trim();

            task.checklist =
                JSON.parse(
                    JSON.stringify(
                        editChecklistItems
                    )
                );

            const fileInput =
                document.getElementById(
                    "editTaskFile"
                );

            if (fileInput.files.length > 0) {

                task.file =
                    await fileToBase64(
                        fileInput.files[0]
                    );

            }

            updateTaskCompletion(task);

            saveTasks();

            closeEditModal();

            renderTasks();

            renderCalendar();

            updateStatistics();

            showNotification(
                "Perubahan tugas berhasil disimpan."
            );

        });


    /* =========================
       OPEN FILE
    ========================= */

    function openFile(id) {

        const task =
            tasks.find(
                task => task.id === id
            );

        if (!task || !task.file) return;

        const link =
            document.createElement("a");

        link.href =
            task.file.data;

        link.download =
            task.file.name;

        link.target =
            "_blank";

        document.body.appendChild(link);

        link.click();

        link.remove();

    }


    /* =========================
       CALENDAR
    ========================= */

    function renderCalendar() {

        const year =
            calendarDate.getFullYear();

        const month =
            calendarDate.getMonth();

        const monthName =
            calendarDate.toLocaleDateString(
                "id-ID",
                {
                    month: "long",
                    year: "numeric"
                }
            );

        document
            .getElementById("calendarTitle")
            .textContent =
            monthName.charAt(0).toUpperCase()
            +
            monthName.slice(1);


        const firstDay =
            new Date(
                year,
                month,
                1
            ).getDay();

        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();

        const container =
            document.getElementById(
                "calendarDays"
            );

        container.innerHTML = "";


        for (
            let i = 0;
            i < firstDay;
            i++
        ) {

            const empty =
                document.createElement("div");

            empty.className =
                "calendar-day empty";

            container.appendChild(empty);

        }


        const today =
            new Date();

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const cell =
                document.createElement("div");

            cell.className =
                "calendar-day";


            if (
                today.getFullYear() === year &&
                today.getMonth() === month &&
                today.getDate() === day
            ) {

                cell.classList.add("today");

            }


            const number =
                document.createElement("div");

            number.className =
                "day-number";

            number.textContent =
                day;

            cell.appendChild(number);


            const dateString =
                `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;


            const dayTasks =
                tasks.filter(
                    task =>
                        task.date === dateString
                );


            dayTasks.forEach(task => {

                const taskElement =
                    document.createElement("div");

                taskElement.className =
                    "calendar-task";

                taskElement.textContent =
                    task.name;

                cell.appendChild(
                    taskElement
                );

            });


            container.appendChild(cell);

        }

    }


    function changeMonth(direction) {

        calendarDate.setMonth(
            calendarDate.getMonth()
            +
            direction
        );

        renderCalendar();

    }


    /* =========================
       NOTIFICATION
    ========================= */

    function requestNotificationPermission() {

        if (
            !("Notification" in window)
        ) {

            showNotification(
                "Browser tidak mendukung notifikasi."
            );

            return;

        }


        Notification
            .requestPermission()
            .then(permission => {

                if (
                    permission === "granted"
                ) {

                    showNotification(
                        "Notifikasi berhasil diaktifkan."
                    );

                    checkDeadlines();

                }

            });

    }


    function checkDeadlines() {

        const now =
            new Date();

        tasks.forEach(task => {

            if (task.completed) return;

            const deadline =
                new Date(
                    `${task.date}T${task.time}`
                );

            const diff =
                deadline - now;

            const hours =
                diff /
                (1000 * 60 * 60);


            if (
                hours > 0 &&
                hours <= 24
            ) {

                const message =
                    `Tugas "${task.name}" deadline dalam kurang dari 24 jam.`;

                showNotification(
                    message,
                    "warning"
                );


                if (
                    "Notification" in window &&
                    Notification.permission === "granted"
                ) {

                    new Notification(
                        "Deadline Tugas",
                        {
                            body: message
                        }
                    );

                }

            }

        });

    }


    function showNotification(
        message,
        type = ""
    ) {

        const container =
            document.getElementById(
                "notificationContainer"
            );

        const notification =
            document.createElement("div");

        notification.className =
            "notification " + type;

        notification.textContent =
            message;

        container.appendChild(
            notification
        );


        setTimeout(() => {

            notification.remove();

        }, 4000);

    }


    /* =========================
       HTML ESCAPE
    ========================= */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text || "";

        return div.innerHTML;

    }


    /* =========================
       MODAL OUTSIDE CLICK
    ========================= */

    document
        .getElementById("editModal")
        .addEventListener(
            "click",
            function(e) {

                if (
                    e.target === this
                ) {

                    closeEditModal();

                }

            }
        );


    /* =========================
       ENTER CHECKLIST
    ========================= */

    document
        .getElementById("checklistInput")
        .addEventListener(
            "keydown",
            function(e) {

                if (
                    e.key === "Enter"
                ) {

                    e.preventDefault();

                    addChecklistItem();

                }

            }
        );


    document
        .getElementById("editChecklistInput")
        .addEventListener(
            "keydown",
            function(e) {

                if (
                    e.key === "Enter"
                ) {

                    e.preventDefault();

                    addEditChecklistItem();

                }

            }
        );


    /* =========================
       INITIALIZATION
    ========================= */

    renderTasks();

    renderCalendar();

    updateStatistics();


    /* =========================
       CHECK DEADLINE
       SETIAP 1 MENIT
    ========================= */

    setInterval(
        checkDeadlines,
        60000
    );

</script>

</body>
</html>
